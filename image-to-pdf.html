<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Tools - Free Online Utility Tools</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8fafc; color: #0f172a; padding: 20px; line-height: 1.5; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); padding: 24px; }
        h1 { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 6px; }
        p.subtitle { font-size: 14px; color: #64748b; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #cbd5e1; background: #f8fafc; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: background 0.2s; margin-bottom: 16px; }
        .upload-area:hover { background: #f1f5f9; }
        .upload-label { font-size: 14px; font-weight: 600; color: #2563eb; cursor: pointer; display: inline-block; padding: 10px 18px; background: #eff6ff; border-radius: 6px; border: 1px solid #bfdbfe; }
        input[type="file"] { display: none; }
        .file-info { font-size: 12px; color: #64748b; margin-top: 8px; }
        .btn-group { display: flex; gap: 10px; margin-top: 16px; }
        .btn { padding: 10px 18px; border-radius: 6px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; }
        .btn-primary { background: #2563eb; color: white; }
        .btn-secondary { background: #e2e8f0; color: #334155; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .preview-box { margin-top: 20px; text-align: center; }
        .preview-box img { max-width: 100%; max-height: 300px; border-radius: 6px; border: 1px solid #e2e8f0; display: none; margin: 0 auto; }
        .status-msg { margin-top: 14px; padding: 10px; border-radius: 6px; font-size: 13px; display: none; }
        .status-error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
        .status-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
        footer { margin-top: 24px; border-top: 1px solid #e2e8f0; padding-top: 16px; font-size: 12px; text-align: center; color: #94a3b8; }
        footer a { color: #64748b; text-decoration: none; margin: 0 8px; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; text-align: center; }
            #printArea img { max-width: 100%; height: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Project Tools</h1>
    <p class="subtitle">Convert Image (JPG/PNG) to PDF directly in browser.</p>

    <div class="upload-area" onclick="document.getElementById('imgFile').click()">
        <label class="upload-label">Choose Image File</label>
        <input type="file" id="imgFile" accept="image/jpeg, image/png">
        <div class="file-info" id="fileText">Supports JPG & PNG up to 15MB</div>
    </div>

    <div class="btn-group">
        <button id="makePdfBtn" class="btn btn-primary" disabled>Save as PDF</button>
        <button id="clearBtn" class="btn btn-secondary" style="display:none;">Reset</button>
    </div>

    <div id="status" class="status-msg"></div>

    <div class="preview-box">
        <img id="imagePreview" alt="Image Preview">
    </div>

    <div id="printArea" style="display:none;">
        <img id="printImg" alt="Print Image">
    </div>

    <footer>
        <a href="privacy.html">Privacy</a> • 
        <a href="terms.html">Terms</a> • 
        <a href="about.html">About</a> • 
        <a href="contact.html">Contact</a>
    </footer>
</div>

<script>
    const fileInput = document.getElementById('imgFile');
    const fileText = document.getElementById('fileText');
    const makePdfBtn = document.getElementById('makePdfBtn');
    const clearBtn = document.getElementById('clearBtn');
    const imagePreview = document.getElementById('imagePreview');
    const printImg = document.getElementById('printImg');
    const printArea = document.getElementById('printArea');
    const status = document.getElementById('status');

    let loadedData = null;

    fileInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        if (file.size > 15 * 1024 * 1024) {
            showMsg('File size exceeds 15MB limit.', true);
            return;
        }

        const reader = new FileReader();

        reader.onload = function(evt) {
            loadedData = evt.target.result;
            imagePreview.src = loadedData;
            printImg.src = loadedData;
            imagePreview.style.display = 'block';
            makePdfBtn.disabled = false;
            clearBtn.style.display = 'inline-block';
            fileText.innerText = `${file.name} (${Math.round(file.size / 1024)} KB)`;
            hideMsg();
        };

        reader.onerror = function() {
            showMsg('Error reading image file.', true);
        };

        reader.readAsDataURL(file);
    });

    makePdfBtn.addEventListener('click', function() {
        if (!loadedData) {
            showMsg('Please select an image first.', true);
            return;
        }

        try {
            printArea.style.display = 'block';
            window.print();
            printArea.style.display = 'none';
            showMsg('PDF action triggered! Choose "Save as PDF".', false);
        } catch (err) {
            showMsg('Error generating PDF: ' + err.message, true);
        }
    });

    clearBtn.addEventListener('click', function() {
        fileInput.value = '';
        loadedData = null;
        imagePreview.style.display = 'none';
        imagePreview.src = '';
        printImg.src = '';
        makePdfBtn.disabled = true;
        clearBtn.style.display = 'none';
        fileText.innerText = 'Supports JPG & PNG up to 15MB';
        hideMsg();
    });

    function showMsg(text, isError) {
        status.innerText = text;
        status.className = 'status-msg ' + (isError ? 'status-error' : 'status-success');
        status.style.display = 'block';
    }

    function hideMsg() {
        status.style.display = 'none';
    }
</script>

</body>
</html>
